name: Native Explorer Frame v0.3.5 (VM lab)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test Rust renderer
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          cargo +stable-x86_64-pc-windows-gnu test --locked --manifest-path MacTrafficNative/Cargo.toml --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable-x86_64-pc-windows-gnu build --locked --manifest-path MacTrafficNative/Cargo.toml --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the Explorer integration
        shell: pwsh
        run: |
          msbuild ExplorerBlurMica.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item build/x64/Release/ExplorerBlurMica.dll artifact/
          Copy-Item MacTrafficNative/target/x86_64-pc-windows-gnu/release/mactraffic_caption.dll artifact/
          Copy-Item build/x64/Release/config.ini artifact/
          $cfg = Get-Content artifact/config.ini -Raw
          $cfg = $cfg -replace '(?m)^effect=\d+', 'effect=2'
          [IO.File]::WriteAllText((Join-Path $PWD 'artifact/config.ini'), $cfg, (New-Object Text.UTF8Encoding($false)))
          Copy-Item COPYING.LESSER,LICENSE artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: native-explorer-v035-vm-lab
          path: artifact/
