name: Windows GNU release build
on:
  workflow_dispatch:
  push:
    tags: ['v1.0.1']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust GNU
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
      - name: Build, test and package
        shell: cmd
        run: package.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: MacTraffic-v1.0.1-win-x64
          path: |
            release/MacTraffic-v1.0.1-win-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  draft-release:
    if: github.ref == 'refs/tags/v1.0.1'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacTraffic-v1.0.1-win-x64
          path: release
      - name: Create draft release for manual approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 --repo '${{ github.repository }}' --verify-tag --draft --title 'MacTraffic v1.0.1' --notes 'Windows x64 GNU portable build. Publish only after desktop acceptance.' release/MacTraffic-v1.0.1-win-x64.zip release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
