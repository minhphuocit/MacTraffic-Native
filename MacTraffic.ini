[MacTraffic]
# Edit from the tray menu; exit and reopen to apply changes.
start_paused=false
browser_spacer=true
office_exact_left=true
alt_keys=true
native_maximize=false
browser_enabled=true
office_enabled=true
# Exact executable names, comma-separated, e.g. mmc.exe,taskmgr.exe
exclude=
# normal / debug / off. Logs rotate at 1 MiB.
log_level=normal
