[MacTraffic]
# Edit from the tray menu; exit and reopen to apply changes.
start_paused=false
browser_spacer=true
office_exact_left=true
alt_keys=true
native_maximize=false
browser_enabled=true
office_enabled=true
# Exact executable names, comma-separated, e.g. mmc.exe,taskmgr.exe
exclude=
# auto: native if known blur provider is loaded, otherwise solid dark/light; native preserves external blur.
# solid_dark / solid_light: experimental uniform caption, not whole-window blur.
explorer_caption=auto
# normal / debug / off. Logs rotate at 1 MiB.
log_level=normal
